<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMOM Generator</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="EMOMGen">
<meta name="theme-color" content="#0a0a0a">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --border: #222222;
    --accent: #e8ff00;
    --accent2: #ff4d00;
    --text: #f0f0f0;
    --muted: #555;
    --card: #161616;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    padding: 40px 20px 80px;
  }
  header {
    max-width: 960px;
    margin: 0 auto 48px;
    display: flex;
    align-items: flex-end;
    gap: 20px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 24px;
  }
  .logo { font-family: 'Bebas Neue', sans-serif; font-size: clamp(48px, 8vw, 80px); color: var(--accent); line-height: 1; letter-spacing: 2px; }
  .logo span { color: var(--accent2); }
  .subtitle { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 3px; padding-bottom: 8px; }
  .main { max-width: 960px; margin: 0 auto; }

  /* FORM */
  .form-section { background: var(--surface); border: 1px solid var(--border); padding: 32px; margin-bottom: 24px; }
  .form-section h2 { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 2px; color: var(--accent); margin-bottom: 24px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
  .full-width { grid-column: 1 / -1; }
  .form-group label {
    display: block;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .form-group .sublabel {
    font-size: 10px;
    color: #333;
    font-family: 'DM Mono', monospace;
    margin-bottom: 8px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* Pattern display */
  .pattern-display {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    color: var(--accent);
    letter-spacing: 3px;
    margin-left: 14px;
    vertical-align: middle;
  }
  .pattern-sub-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-top: 12px;
  }
  @media (max-width: 480px) { .pattern-sub-grid { grid-template-columns: 1fr; } }

  /* Chips */
  .chip-group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip-cat {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: #444;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 2px 0;
    width: 100%;
    margin-top: 8px;
    border-top: 1px solid #1e1e1e;
    padding-top: 10px;
  }
  .chip-cat:first-child { margin-top: 0; border-top: none; padding-top: 0; }
  .chip {
    padding: 6px 14px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 500; }
  .chip.active-move { background: var(--accent2); color: #fff; border-color: var(--accent2); font-weight: 500; }

  textarea {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    padding: 12px;
    resize: vertical;
    min-height: 70px;
    outline: none;
    transition: border-color 0.2s;
  }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--muted); }

  /* API Section */
  .api-section { background: var(--surface); border: 1px solid var(--border); padding: 24px 32px; margin-bottom: 24px; }
  .api-section h2 { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 2px; color: #fff; margin-bottom: 16px; }
  .api-block { margin-bottom: 16px; }
  .api-block:last-child { margin-bottom: 0; }
  .api-block-label { font-family: 'DM Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); margin-bottom: 8px; }
  .api-input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .api-input:focus { border-color: #fff; }
  .api-input::placeholder { color: var(--muted); }

  /* Buttons */
  .btn-primary {
    display: block; width: 100%; padding: 18px;
    background: var(--accent); color: #000;
    font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 3px;
    border: none; cursor: pointer; transition: background 0.15s, transform 0.1s;
    margin-bottom: 24px;
  }
  .btn-primary:hover { background: #fff; }
  .btn-primary:active { transform: scale(0.99); }
  .btn-primary:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }

  /* Loading */
  .loading { display: none; text-align: center; padding: 48px; font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); letter-spacing: 2px; }
  .loading.show { display: block; }
  .loader { width: 40px; height: 40px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Workout cards */
  .workouts-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .workouts-header h2 { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 2px; color: var(--accent); }
  .workout-card { background: var(--card); border: 1px solid var(--border); margin-bottom: 20px; overflow: hidden; animation: fadeUp 0.4s ease forwards; opacity: 0; transform: translateY(10px); }
  @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
  .workout-card:nth-child(2) { animation-delay: 0.1s; }
  .workout-card:nth-child(3) { animation-delay: 0.2s; }

  .workout-header { display: flex; align-items: center; gap: 16px; padding: 16px 20px; border-bottom: 1px solid var(--border); background: var(--surface); flex-wrap: wrap; }
  .workout-num { font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: var(--accent); line-height: 1; min-width: 40px; }
  .workout-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1px; color: var(--text); }
  .workout-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
  .tag { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 1px; text-transform: uppercase; padding: 3px 8px; border: 1px solid var(--accent2); color: var(--accent2); }

  .workout-body { padding: 20px 24px; }
  .emom-label { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 18px; }

  /* movement layout */
  .movements-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  @media (max-width: 560px) { .movements-grid { grid-template-columns: 1fr; } }
  .movement-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--muted);
    padding: 14px 16px;
    position: relative;
    overflow: hidden;
  }
  .movement-block::before {
    content: attr(data-letter);
    position: absolute;
    top: -4px; right: 8px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 56px;
    color: #1a1a1a;
    line-height: 1;
    pointer-events: none;
  }
  .mv-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .mv-letter { font-family: 'Bebas Neue', sans-serif; font-size: 22px; line-height: 1; }
  .mv-mins { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--muted); letter-spacing: 1px; margin-left: auto; }
  .mv-content { font-size: 14px; color: var(--text); line-height: 1.5; font-weight: 500; }

  /* rotation bar */
  .rotation-bar { display: flex; gap: 3px; margin-top: 16px; margin-bottom: 16px; flex-wrap: wrap; }
  .rot-block {
    flex: 1;
    min-width: 20px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 0.5px;
  }
  .rot-label { font-family: 'DM Mono', monospace; font-size: 8px; color: var(--muted); letter-spacing: 1px; margin-bottom: 4px; }

  .workout-notes { padding: 12px 16px; background: var(--surface); border-left: 2px solid var(--muted); font-size: 13px; color: var(--muted); line-height: 1.6; margin-top: 4px; }

  /* Error */
  .error-box { background: #1f0000; border: 1px solid #5f0000; color: #ff6b6b; padding: 16px; font-family: 'DM Mono', monospace; font-size: 12px; margin-bottom: 16px; line-height: 1.6; }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">EMOM<span>GEN</span></div>
    <div class="subtitle">CrossFit EMOM Generator — Powered by Claude</div>
  </div>
</header>

<div class="main">

  <!-- 01 Workout Conditions -->
  <div class="form-section">
    <h2>01 — ワークアウト条件</h2>
    <div class="form-grid">

      <div class="form-group">
        <label>ターゲット部位</label>
        <div class="chip-group" id="chips-target">
          <button class="chip" data-group="target" data-val="Full Body">Full Body</button>
          <button class="chip" data-group="target" data-val="Upper Body">Upper Body</button>
          <button class="chip" data-group="target" data-val="Lower Body">Lower Body</button>
          <button class="chip" data-group="target" data-val="Core">Core</button>
          <button class="chip" data-group="target" data-val="Posterior Chain">Posterior</button>
        </div>
      </div>

      <div class="form-group">
        <label>強度レベル</label>
        <div class="chip-group" id="chips-level">
          <button class="chip" data-group="level" data-val="Beginner">初級</button>
          <button class="chip active" data-group="level" data-val="Intermediate">中級</button>
          <button class="chip" data-group="level" data-val="Advanced">上級</button>
          <button class="chip" data-group="level" data-val="RX">RX+</button>
        </div>
      </div>

      <!-- EMOM Pattern -->
      <div class="form-group full-width">
        <label>EMOMパターン <span id="pattern-display" class="pattern-display">4 × 3 = 12分</span></label>
        <div class="pattern-sub-grid">
          <div>
            <div class="sublabel">動作数 (Movements)</div>
            <div class="chip-group">
              <button class="chip" data-group="numMovements" data-val="2">2</button>
              <button class="chip" data-group="numMovements" data-val="3">3</button>
              <button class="chip active" data-group="numMovements" data-val="4">4</button>
              <button class="chip" data-group="numMovements" data-val="5">5</button>
              <button class="chip" data-group="numMovements" data-val="6">6</button>
            </div>
          </div>
          <div>
            <div class="sublabel">ラウンド数 (Rounds)</div>
            <div class="chip-group">
              <button class="chip" data-group="numRounds" data-val="2">2</button>
              <button class="chip active" data-group="numRounds" data-val="3">3</button>
              <button class="chip" data-group="numRounds" data-val="4">4</button>
              <button class="chip" data-group="numRounds" data-val="5">5</button>
              <button class="chip" data-group="numRounds" data-val="6">6</button>
            </div>
          </div>
        </div>
      </div>

      <div class="form-group full-width">
        <label>使用器具 <span style="color:#444;font-size:9px;letter-spacing:1px">— 選んだ器具のみ使用・未選択の器具は絶対に使わない</span></label>
        <div class="chip-group" id="chips-equipment">
          <button class="chip active" data-group="equipment" data-val="Barbell">バーベル</button>
          <button class="chip" data-group="equipment" data-val="Kettlebell">ケトルベル</button>
          <button class="chip active" data-group="equipment" data-val="Dumbbells">ダンベル</button>
          <button class="chip" data-group="equipment" data-val="Pull-up Bar">懸垂台</button>
          <button class="chip" data-group="equipment" data-val="Rings">リング</button>
          <button class="chip" data-group="equipment" data-val="Box">ボックス</button>
          <button class="chip" data-group="equipment" data-val="Jump Rope">縄跳び</button>
          <button class="chip" data-group="equipment" data-val="Rower">ロウイング</button>
          <button class="chip" data-group="equipment" data-val="Ski Erg">スキーエルグ</button>
          <button class="chip" data-group="equipment" data-val="Bodyweight Only">器具なし</button>
        </div>
      </div>

      <div class="form-group full-width">
        <label>CrossFit 動作 <span style="color:#444;font-size:9px;letter-spacing:1px">— 選んだ動作・またはその練習を必ず含む</span></label>
        <div class="chip-group" id="chips-movements">
          <span class="chip-cat">Olympic Lifting</span>
          <button class="chip" data-group="movements" data-val="Clean">Clean</button>
          <button class="chip" data-group="movements" data-val="Power Clean">Power Clean</button>
          <button class="chip" data-group="movements" data-val="Hang Clean">Hang Clean</button>
          <button class="chip" data-group="movements" data-val="Clean & Jerk">C&J</button>
          <button class="chip" data-group="movements" data-val="Snatch">Snatch</button>
          <button class="chip" data-group="movements" data-val="Power Snatch">Power Snatch</button>
          <button class="chip" data-group="movements" data-val="Hang Snatch">Hang Snatch</button>
          <button class="chip" data-group="movements" data-val="Split Jerk">Split Jerk</button>
          <span class="chip-cat">Gymnastics</span>
          <button class="chip" data-group="movements" data-val="Pull-up">Pull-up</button>
          <button class="chip" data-group="movements" data-val="Chest-to-Bar">C2B</button>
          <button class="chip" data-group="movements" data-val="Toes-to-Bar">T2B</button>
          <button class="chip" data-group="movements" data-val="Knees-to-Elbow">K2E</button>
          <button class="chip" data-group="movements" data-val="Handstand Push-up">HSPU</button>
          <button class="chip" data-group="movements" data-val="Handstand Walk">HS Walk</button>
          <button class="chip" data-group="movements" data-val="Bar Muscle-up">Bar MU</button>
          <button class="chip" data-group="movements" data-val="Ring Muscle-up">Ring MU</button>
          <button class="chip" data-group="movements" data-val="Ring Dip">Ring Dip</button>
          <button class="chip" data-group="movements" data-val="Pistol Squat">Pistol</button>
          <button class="chip" data-group="movements" data-val="Double Under">DU</button>
          <span class="chip-cat">Barbell / Strength</span>
          <button class="chip" data-group="movements" data-val="Back Squat">Back Squat</button>
          <button class="chip" data-group="movements" data-val="Front Squat">Front Squat</button>
          <button class="chip" data-group="movements" data-val="Overhead Squat">OHS</button>
          <button class="chip" data-group="movements" data-val="Deadlift">Deadlift</button>
          <button class="chip" data-group="movements" data-val="Thruster">Thruster</button>
          <button class="chip" data-group="movements" data-val="Push Press">Push Press</button>
          <button class="chip" data-group="movements" data-val="Push Jerk">Push Jerk</button>
          <button class="chip" data-group="movements" data-val="Strict Press">Strict Press</button>
          <span class="chip-cat">Other</span>
          <button class="chip" data-group="movements" data-val="Box Jump">Box Jump</button>
          <button class="chip" data-group="movements" data-val="Burpee">Burpee</button>
          <button class="chip" data-group="movements" data-val="Wall Ball">Wall Ball</button>
          <button class="chip" data-group="movements" data-val="Kettlebell Swing">KB Swing</button>
          <button class="chip" data-group="movements" data-val="Turkish Get-up">TGU</button>
        </div>
      </div>

      <div class="form-group full-width">
        <label>追加メモ（任意）</label>
        <textarea id="extra-notes" placeholder="例：肩の怪我に配慮、週3回プログラム、など"></textarea>
      </div>

    </div>
  </div>

  <!-- 02 API Settings -->
  <div class="api-section">
    <h2>02 — API 設定</h2>
    <div class="api-block">
      <div class="api-block-label">Anthropic API Key（必須）</div>
      <input type="password" id="anthropic-key" class="api-input" placeholder="sk-ant-...">
    </div>
  </div>

  <!-- Generate -->
  <button class="btn-primary" id="gen-btn" onclick="generate()">
    ⚡ 4×3 EMOM ワークアウトを生成する
  </button>

  <!-- Loading -->
  <div class="loading" id="loading">
    <div class="loader"></div>
    <div>GENERATING WORKOUTS...</div>
  </div>

  <!-- Error -->
  <div class="error-box" id="error-box" style="display:none"></div>

  <!-- Results -->
  <div id="results" style="display:none">
    <div class="workouts-header">
      <h2>生成されたワークアウト</h2>
    </div>
    <div id="workout-list"></div>
  </div>

</div>

<script>
const selections = {
  target: [],
  level: ['Intermediate'],
  equipment: ['Barbell', 'Dumbbells'],
  movements: [],
  numMovements: [4],
  numRounds: [3]
};
let workouts = [];

// 6-color palette for up to 6 movements
const MV_COLORS = ['#e8ff00', '#ff4d00', '#00cfff', '#bf7fff', '#00ff88', '#ff88cc'];
const MV_LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];

window.addEventListener('load', () => {
  const ak = localStorage.getItem('emom_anthropic_key');
  if (ak) document.getElementById('anthropic-key').value = ak;
  updatePatternUI();
});

// Chip toggle
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    const group = chip.dataset.group;
    const val = chip.dataset.val;
    const single = group === 'level' || group === 'numMovements' || group === 'numRounds';
    const isMove = group === 'movements';

    if (single) {
      document.querySelectorAll(`[data-group="${group}"]`).forEach(c => c.classList.remove('active'));
      selections[group] = [isNaN(val) ? val : Number(val)];
      chip.classList.add('active');
      if (group === 'numMovements' || group === 'numRounds') updatePatternUI();
    } else {
      const activeClass = isMove ? 'active-move' : 'active';
      if (chip.classList.contains('active') || chip.classList.contains('active-move')) {
        chip.classList.remove('active', 'active-move');
        selections[group] = selections[group].filter(v => v !== val);
      } else {
        chip.classList.add(activeClass);
        selections[group].push(val);
      }
    }
  });
});

function updatePatternUI() {
  const N = Number(selections.numMovements[0]);
  const R = Number(selections.numRounds[0]);
  const total = N * R;
  document.getElementById('pattern-display').textContent = `${N} × ${R} = ${total}分`;
  document.getElementById('gen-btn').textContent = `⚡ ${N}×${R} EMOM ワークアウトを生成する`;
}

async function generate() {
  const anthropicKey = document.getElementById('anthropic-key').value.trim();
  if (!anthropicKey) {
    showError('Anthropic APIキーを入力してください（02 — API設定）');
    return;
  }
  localStorage.setItem('emom_anthropic_key', anthropicKey);

  const N = Number(selections.numMovements[0]);
  const R = Number(selections.numRounds[0]);
  const totalMins = N * R;
  const letters = MV_LETTERS.slice(0, N);

  const btn = document.getElementById('gen-btn');
  const loading = document.getElementById('loading');
  const results = document.getElementById('results');
  const errorBox = document.getElementById('error-box');

  btn.disabled = true;
  loading.classList.add('show');
  results.style.display = 'none';
  errorBox.style.display = 'none';

  const equipment = selections.equipment.length ? selections.equipment.join(', ') : 'Bodyweight only (no equipment)';
  const movements = selections.movements.length ? selections.movements.join(', ') : 'Any CrossFit movements';
  const target = selections.target.length ? selections.target.join(', ') : 'Full Body';
  const notes = document.getElementById('extra-notes').value || 'None';

  // Build dynamic minute assignment description
  const structureLines = letters.map((letter, i) => {
    const mins = [];
    for (let r = 0; r < R; r++) mins.push(r * N + i + 1);
    return `- Movement ${letter} → minutes ${mins.join(', ')}`;
  }).join('\n');

  // Build example JSON movements array
  const exampleMovements = letters.map(l => `{"label": "${l}", "content": "specific reps + movement + weight/scale"}`).join(',\n        ');

  const prompt = `You are an expert CrossFit programmer. Generate exactly 3 distinct ${totalMins}-minute EMOM workouts.

STRUCTURE (mandatory):
Each workout has exactly ${N} movements (${letters.join(', ')}) that rotate ${R} times (${totalMins} minutes total):
${structureLines}

STRICT RULES:
1. EQUIPMENT: Only use equipment from this list: [${equipment}]
   ❌ ABSOLUTELY DO NOT use any equipment NOT in this list.
   Example: if "Pull-up Bar" is NOT listed, do not include pull-ups, T2B, etc.
2. MOVEMENTS: You MUST include these CrossFit movements (or their skill/practice progressions) in the workout: [${movements}]
   If a movement conflicts with available equipment, include a progression or drill for it instead.
3. TARGET: ${target}
4. LEVEL: ${selections.level[0]}
5. NOTES: ${notes}

Respond ONLY with valid JSON (no markdown, no backticks):
{
  "workouts": [
    {
      "title": "Workout name",
      "tags": ["tag1", "tag2"],
      "movements": [
        ${exampleMovements}
      ],
      "coaching_notes": "brief coaching cue or scaling note"
    }
  ]
}`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': anthropicKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 2500,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || `HTTPエラー: ${res.status}`);
    const text = data.content.map(b => b.text || '').join('');
    const jsonMatch = text.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error('JSONの解析に失敗しました');
    workouts = JSON.parse(jsonMatch[0]).workouts;
    renderWorkouts(workouts, N, R);
    results.style.display = 'block';
  } catch(e) {
    showError('エラー: ' + e.message);
  }

  btn.disabled = false;
  loading.classList.remove('show');
}

function showError(msg) {
  const el = document.getElementById('error-box');
  el.style.display = 'block';
  el.textContent = msg;
}

function renderWorkouts(wks, N, R) {
  if (!N) N = Number(selections.numMovements[0]);
  if (!R) R = Number(selections.numRounds[0]);
  const totalMins = N * R;
  const letters = MV_LETTERS.slice(0, N);

  // Compute minute labels per movement
  const mvMins = letters.map((_, i) => {
    const mins = [];
    for (let r = 0; r < R; r++) mins.push(String(r * N + i + 1));
    return mins;
  });

  // Rotation order: A B C ... N-1, A B C ... (R times)
  const rotOrder = [];
  for (let r = 0; r < R; r++) {
    for (let i = 0; i < N; i++) rotOrder.push(i);
  }

  const list = document.getElementById('workout-list');
  list.innerHTML = '';

  wks.forEach((w, wi) => {
    const tags = (w.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
    const mvs = (w.movements || []).slice(0, N);

    const movHtml = mvs.map((m, mi) => {
      const color = MV_COLORS[mi];
      return `
        <div class="movement-block" data-letter="${letters[mi]}" style="border-left:3px solid ${color}">
          <div class="mv-header">
            <span class="mv-letter" style="color:${color}">${letters[mi]}</span>
            <span class="mv-mins">MIN ${mvMins[mi].join(' · ')}</span>
          </div>
          <div class="mv-content">${m.content}</div>
        </div>`;
    }).join('');

    const rotHtml = rotOrder.map((mi, min) => {
      const color = MV_COLORS[mi];
      return `<div class="rot-block" style="background:${color}18;color:${color};border-top:2px solid ${color}" title="Min ${min+1}: ${letters[mi]}">${letters[mi]}</div>`;
    }).join('');

    const numStr = wi < 9 ? `0${wi+1}` : `${wi+1}`;
    list.innerHTML += `
      <div class="workout-card">
        <div class="workout-header">
          <div class="workout-num">${numStr}</div>
          <div class="workout-title">${w.title}</div>
          <div class="workout-tags">${tags}</div>
        </div>
        <div class="workout-body">
          <div class="emom-label">${N} Movements × ${R} Rounds = ${totalMins}-EMOM</div>
          <div class="movements-grid">${movHtml}</div>
          <div class="rot-label">${totalMins}-MIN ROTATION</div>
          <div class="rotation-bar">${rotHtml}</div>
          ${w.coaching_notes ? `<div class="workout-notes">💬 ${w.coaching_notes}</div>` : ''}
        </div>
      </div>`;
  });
}
</script>
